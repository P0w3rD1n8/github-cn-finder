name: 数据自动更新

# 每小时第 15 分钟跑一次（避开整点排队高峰，官方实测整点延迟大）；
# 也可在 Actions 页面手动触发（workflow_dispatch）
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 并发锁：手动触发与定时任务撞车时，取消旧任务只保留最新一次，避免 push 打架
concurrency:
  group: data-update
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取 GitHub 真实数据
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python fetch-data.py

      - name: 提交数据更新
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repos.json
          git add weekly.json 2>/dev/null || true
          # v1.36.3：记下这次有没有写入新的周快照。GITHUB_TOKEN 推的提交不会触发
          # 其它 workflow（GitHub 防递归规则），所以 build-pages 的 weekly.json
          # 路径触发从来就没生效过 —— 只能在本 workflow 里自己接着做。
          if git diff --cached --name-only | grep -qx 'weekly.json'; then
            echo "weekly_changed=1" >> "$GITHUB_OUTPUT"
            echo "📅 检测到新周快照，稍后重建周刊"
          else
            echo "weekly_changed=0" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动更新精选库数据 $(date -u +%Y-%m-%d_%H:%M)"
            git pull --rebase origin main && git push origin main && echo "✅ 已提交并推送最新数据"
          fi

      - name: 安装出图依赖（仅新快照时）
        if: steps.commit.outputs.weekly_changed == '1'
        run: |
          python -m pip install --quiet pillow qrcode
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 新周快照 -> 重建周刊 / RSS / 涨星榜图
        if: steps.commit.outputs.weekly_changed == '1'
        continue-on-error: true   # 配图出问题不能拖垮数据管线
        run: |
          python build_weekly_card.py
          python build_extra.py
          git add weekly feed.xml sitemap.xml
          if git diff --cached --quiet; then
            echo "页面无变化，跳过"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: 新周快照 -> 重建周刊与涨星榜图 $(date -u +%Y-%m-%d_%H:%M)"
            git pull --rebase origin main && git push origin main && echo "✅ 周刊与涨星榜图已重建"
          fi

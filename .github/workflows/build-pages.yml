name: 生成静态项目页

# B+ 方案（v1.19）：改 data.js 时自动重新生成静态项目页，无需手动跑；
# 也可在 Actions 页面手动触发（workflow_dispatch）
on:
  push:
    paths:
      - "data.js"
      - "weekly.json"   # v1.32.2：每周快照写入后要重建 weekly/ 与 feed.xml，否则页面停在上一期
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # v1.28.0：更新记录页要读 data.js 的完整提交历史

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Pillow 与中文字体（生成分享封面用）
        run: |
          python -m pip install --quiet pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 生成每个项目的分享封面（v1.27.0）
        run: python build_og.py

      - name: 生成静态项目页
        run: python build_pages.py

      - name: 生成合辑 / 周刊 / RSS（v1.26.0）
        run: python build_extra.py

      - name: 生成年度精选（v1.30.0）
        run: python build_annual.py

      - name: 生成更新记录时间线（v1.28.0）
        run: python build_timeline.py

      - name: 提交生成的页面
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p list.html sitemap.xml c weekly feed.xml og timeline updates.json annual
          if git diff --cached --quiet; then
            echo "页面无变化，跳过提交"
          else
            git commit -m "chore: 重新生成静态项目页 $(date -u +%Y-%m-%d_%H:%M)"
            git pull --rebase origin main && git push origin main && echo "✅ 已生成并推送静态页"
          fi
